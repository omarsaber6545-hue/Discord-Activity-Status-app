name: Build & Release Android APK 🚀

on:
  push:
    branches: [ "**" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: 🛠️ Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: ⚙️ Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 🔑 Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: 🔨 Generate Debug Keystore for Release Signing (Fallback)
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore -alias androiddebugkey -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: 🚀 Build APK (Release & Debug)
        run: |
          ./gradlew assembleRelease assembleDebug --stacktrace

      - name: 🔍 Find & Prepare APK Files
        id: apk_files
        run: |
          mkdir -p build_output
          find app/build/outputs/apk/ -name "*.apk" -exec cp {} build_output/ \;
          echo "Found APK files:"
          ls -la build_output/

      - name: 📦 Upload APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Discord-Activity-Status-APK
          path: build_output/*.apk
          retention-days: 30

      - name: 🏷️ Publish GitHub Release (On Tag Push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build_output/*.apk
          draft: false
          prerelease: false
          generate_release_notes: true
          name: Release ${{ github.ref_name }} 🎮
          body: |
            ## 🎮 omar dev - Discord Activity Status APK (${{ github.ref_name }})
            
            ### ✨ ما الجديد في هذا الإصدار:
            - بناء تلقائي عبر GitHub Actions لنظام Android.
            - واجهة Dark Premium AMOLED فائقة السرعة مع Live Preview.
            - محاكي الكونسول و الـ VR (Quest 3, PS5, Xbox, Mobile).
            - دعم البقاء بالروم الصوتي 24/7 والرد التلقائي AFK.
            - إشعارات منبثقة وسجل أحداث متكامل.
            
            ### 📲 التحميل والتثبيت:
            قم بتحميل ملف الـ `.apk` المرفق وتثبيته مباشرة على هاتفك!
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
